services:
  - type: web
    name: solarsync-selangor
    runtime: docker
    region: singapore
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: off
    disk:
      name: solarsync-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: SOLARSYNC_DB_PATH
        value: /var/data/township_solar.db
      - key: SOLARSYNC_DATA_DIR
        value: /var/data/source-archives
      - key: SOLARSYNC_STATIC_DIR
        value: /app/dist
      - key: SOLARSYNC_BOOTSTRAP_DIR
        value: /app/deployment-data
      - key: SOLARSYNC_ACCESS_USER
        value: solarsync
      - key: SOLARSYNC_ACCESS_PASSWORD
        generateValue: true
